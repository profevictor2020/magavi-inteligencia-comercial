databases:
  - name: magavi-db
    plan: free
    databaseName: magavi
    user: magavi

services:
  - type: web
    name: magavi-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    # Publish the Docker image built from every commit merged into the connected
    # branch instead of continuing to serve the previous successful image.
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: magavi-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
  - type: cron
    name: magavi-instagram-discovery
    runtime: docker
    plan: starter
    schedule: "*/15 * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python /app/scripts/trigger_discovery.py
    envVars:
      - key: AUTOMATION_TOKEN
        sync: false
      - key: MAGAVI_BASE_URL
        value: https://magavi-web-vaaa.onrender.com
